<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f9">
  <title>追剧搭子 · 原生组件提案</title>
  <link rel="stylesheet" href="./widget-v3.css?v=0.3.0">
  <link rel="stylesheet" href="./companion-v3.css?v=0.3.0">
</head>
<body>
  <header class="site-header"><a class="brand" href="./widget-v3.html">追剧搭子<span>桌面小组件</span></a><span class="local-status"><i aria-hidden="true"></i>仅本地预览 <span>03</span></span></header>
  <main>
    <section class="workbench" aria-label="桌面小组件设计预览">
      <aside class="controls">
        <div class="intro"><p class="eyebrow">追剧，在桌面上继续</p><h1>把故事，<br>留在桌面。</h1><p class="description">有点嘴欠，也替你记得。<br>点一下，从上次的故事继续。</p></div>
        <section class="control-section" aria-labelledby="scenarioTitle"><div class="section-heading"><h2 id="scenarioTitle">观看状态</h2><span>模拟情境</span></div><div class="scenario-list" id="scenarioList" role="group" aria-labelledby="scenarioTitle"></div></section>
        <div class="control-row"><span id="toneLabel">文案语气</span><div class="segmented" id="toneOptions" role="group" aria-labelledby="toneLabel"><button type="button" data-tone="gentle" aria-pressed="false">温柔点</button><button type="button" data-tone="cheeky" aria-pressed="true">有点欠</button></div><button type="button" class="refresh-copy" id="refreshCopy" aria-label="换一句台词"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 8a6.3 6.3 0 1 0 .1 4M16 3v5h-5"/></svg></button></div>
        <div class="control-row appearance-row"><span id="appearanceLabel">组件外观</span><div class="segmented" id="appearanceOptions" role="group" aria-labelledby="appearanceLabel"><button type="button" data-appearance="light" aria-pressed="true">浅色</button><button type="button" data-appearance="dark" aria-pressed="false">深色</button></div></div>
        <details class="history-details"><summary>观看记录与触发依据 <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg></summary><p id="stateReason"></p><div id="historyList"></div></details>
        <p class="control-note">跨剧读取最近观看历史，不绑定单部剧。<br>这里只模拟数据，不接真实账号。</p>
      </aside>
      <section class="preview-column" aria-label="iPhone 主屏幕预览">
        <div class="preview-meta"><span>iPhone 16 · 主屏幕</span><button type="button" id="previewScale" aria-pressed="false" aria-label="切换原尺寸预览">适应窗口 <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button></div>
        <div class="device-wrap"><div class="device" id="deviceMount"></div></div>
        <p class="preview-hint" id="widgetHint">点击组件，体验从上次进度继续。</p>
        <div class="preview-actions"><button type="button" id="resetDemo">重置情境</button><span aria-hidden="true">·</span><a href="https://developer.apple.com/design/resources/" target="_blank" rel="noreferrer">Apple 官方设备素材 ↗</a></div>
      </section>
    </section>
    <footer class="page-footer"><p>官方设备外框 · 屏幕内容为可交互 HTML 原型</p><div><a href="https://developer.apple.com/design/human-interface-guidelines/widgets" target="_blank" rel="noreferrer">Apple Widgets</a><a href="https://tdesign.tencent.com/design/fonts" target="_blank" rel="noreferrer">TDesign</a><a href="./widget.html?scene=away&tone=cheeky">上一版</a></div></footer>
  </main>
  <p class="feedback" id="reaction" role="status" aria-live="polite"></p>
  <dialog id="returnDialog" aria-labelledby="returnTitle"><button type="button" id="closeDialog" class="dialog-close" aria-label="关闭预览"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg></button><div id="returnBody"></div></dialog>
  <script type="module" src="./widget-v3.mjs?v=0.3.0"></script>
</body>
</html>
