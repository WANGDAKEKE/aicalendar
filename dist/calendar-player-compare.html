<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e8e3df">
  <title>追剧日历 · 全屏与两种半屏首图对照</title>
  <link rel="stylesheet" href="./princess-calendar-compare.css?v=1.0.0">
  <link rel="stylesheet" href="./calendar-player-compare.css?v=1.0.0">
</head>
<body class="pcc-page cpc-page">
  <main class="pcc-showcase cpc-showcase">
    <header class="pcc-intro cpc-intro">
      <h1>全屏与两种半屏首图对照</h1>
      <p>上方视频固定 · 下方日历独立滚动</p>
    </header>

    <section class="cpc-group" aria-labelledby="princessGroupTitle">
      <header class="cpc-group__heading"><h2 id="princessGroupTitle">剧集 · 尚公主</h2></header>
      <div class="pcc-versions">
        <section class="pcc-version" aria-labelledby="princessFullTitle">
          <header class="pcc-version__heading"><h3 id="princessFullTitle">全屏日历 · 保留</h3><a href="./princess-calendar.html?entry=widget" target="_blank" rel="noopener">单独查看 ↗</a></header>
          <div class="pcc-stage"><iframe src="./princess-calendar.html?presentation=embedded&amp;entry=widget" title="尚公主全屏查询日历，保留版本" allow="clipboard-write"></iframe></div>
        </section>
        <section class="pcc-version" aria-labelledby="princessPlayerTitle">
          <header class="pcc-version__heading"><h3 id="princessPlayerTitle">半屏日历 · 紧凑首图</h3><a href="./princess-calendar.html?entry=widget&amp;layout=player" target="_blank" rel="noopener">单独查看 ↗</a></header>
          <div class="pcc-stage"><iframe src="./princess-calendar.html?presentation=embedded&amp;entry=widget&amp;layout=player" title="尚公主视频上方固定、下方半屏查询日历" allow="clipboard-write"></iframe></div>
        </section>
        <section class="pcc-version" aria-labelledby="princessFullHeroTitle">
          <header class="pcc-version__heading"><h3 id="princessFullHeroTitle">半屏日历 · 完整首图</h3><a href="./princess-calendar.html?entry=widget&amp;layout=player&amp;hero=full" target="_blank" rel="noopener">单独查看 ↗</a></header>
          <div class="pcc-stage"><iframe src="./princess-calendar.html?presentation=embedded&amp;entry=widget&amp;layout=player&amp;hero=full" title="尚公主视频上方固定、半屏日历完整首图方案" allow="clipboard-write"></iframe></div>
        </section>
      </div>
    </section>

    <section class="cpc-group" aria-labelledby="animeGroupTitle">
      <header class="cpc-group__heading"><h2 id="animeGroupTitle">动漫 · 斩神Ⅱ</h2></header>
      <div class="pcc-versions">
        <section class="pcc-version" aria-labelledby="animeFullTitle">
          <header class="pcc-version__heading"><h3 id="animeFullTitle">全屏日历 · 保留</h3><a href="./zhanshen-calendar.html" target="_blank" rel="noopener">单独查看 ↗</a></header>
          <div class="pcc-stage"><iframe src="./zhanshen-calendar.html?presentation=embedded" title="斩神Ⅱ全屏查询日历，保留版本" allow="clipboard-write"></iframe></div>
        </section>
        <section class="pcc-version" aria-labelledby="animePlayerTitle">
          <header class="pcc-version__heading"><h3 id="animePlayerTitle">半屏日历 · 紧凑首图</h3><a href="./zhanshen-calendar.html?layout=player" target="_blank" rel="noopener">单独查看 ↗</a></header>
          <div class="pcc-stage"><iframe src="./zhanshen-calendar.html?presentation=embedded&amp;layout=player" title="斩神Ⅱ视频上方固定、下方半屏查询日历" allow="clipboard-write"></iframe></div>
        </section>
        <section class="pcc-version" aria-labelledby="animeFullHeroTitle">
          <header class="pcc-version__heading"><h3 id="animeFullHeroTitle">半屏日历 · 完整首图</h3><a href="./zhanshen-calendar.html?layout=player&amp;hero=full" target="_blank" rel="noopener">单独查看 ↗</a></header>
          <div class="pcc-stage"><iframe src="./zhanshen-calendar.html?presentation=embedded&amp;layout=player&amp;hero=full" title="斩神Ⅱ视频上方固定、半屏日历完整首图方案" allow="clipboard-write"></iframe></div>
        </section>
      </div>
    </section>
  </main>
  <script type="module" src="./princess-calendar-compare.mjs?v=1.0.0"></script>
</body>
</html>
